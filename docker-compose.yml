services:
  api:
    build:
      context: .
    container_name: dot_interview_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dot_interview:dot_interview_password@postgres:5432/dot_interview}
      API_TOKEN: ${API_TOKEN:-dev-api-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LANGCHAIN_MODEL: ${LANGCHAIN_MODEL:-openai:tencent/hy3:free}
      CONVERSATION_AGENT_TIMEOUT_SECONDS: ${CONVERSATION_AGENT_TIMEOUT_SECONDS:-180}
      CONVERSATION_AGENT_NAME: ${CONVERSATION_AGENT_NAME:-DOT-Interview-Tutor-MVP}
      CONVERSATION_AGENT_VERSION: ${CONVERSATION_AGENT_VERSION:-1.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dot_interview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dot_interview}
      POSTGRES_USER: ${POSTGRES_USER:-dot_interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dot_interview_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
